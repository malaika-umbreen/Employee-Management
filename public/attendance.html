<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
    <style> /* same as department */ </style>
</head>
<body>
<h2>Attendance</h2>
<div id="attendance-table"></div>

<h3>Add Attendance</h3>
<form action="insert_attendance.php" method="POST">
    <input type="number" name="employee_id" placeholder="Employee ID" required>
    <input type="date" name="date" required>
    <input type="time" name="check_in">
    <input type="time" name="check_out">
    <input type="number" name="break_duration" placeholder="Break Duration (min)">
    <input type="number" step="0.01" name="total_hours" placeholder="Total Hours">
    <select name="status">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
        <option value="Late">Late</option>
        <option value="Half Day">Half Day</option>
        <option value="Holiday">Holiday</option>
    </select>
    <input type="text" name="notes" placeholder="Notes">
    <input type="submit" value="Add Attendance">
</form>

<script>
    fetch('fetch_attendance.php')
        .then(res => res.text())
        .then(data => document.getElementById('attendance-table').innerHTML = data);
</script>
</body>
</html>
