<!DOCTYPE html>
<html>
<head>
    <title>Departments</title>
    <style>
        body { font-family: Arial; background: #eef; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 10px; }
        th { background: #007bff; color: white; }
        form { background: white; padding: 20px; box-shadow: 0 0 10px #ccc; }
        input, select { width: 100%; margin-bottom: 10px; padding: 8px; }
        input[type="submit"] { background: #28a745; color: white; border: none; }
    </style>
</head>
<body>
<h2>Departments</h2>
<div id="department-table"></div>

<h3>Add Department</h3>
<form action="insert_department.php" method="POST">
    <input type="text" name="name" placeholder="Department Name" required>
    <input type="text" name="description" placeholder="Description">
    <input type="number" name="manager_id" placeholder="Manager ID">
    <input type="number" step="0.01" name="budget" placeholder="Budget">
    <select name="status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
    </select>
    <input type="submit" value="Add Department">
</form>

<script>
    fetch('fetch_department.php')
        .then(response => response.text())
        .then(data => document.getElementById('department-table').innerHTML = data);
</script>
</body>
</html>
