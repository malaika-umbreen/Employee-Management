<!DOCTYPE html>
<html>
<head>
    <title>Payroll</title>
    <style> /* same styling */ </style>
</head>
<body>
<h2>Payroll</h2>
<div id="payroll-table"></div>

<h3>Add Payroll Record</h3>
<form action="insert_payroll.php" method="POST">
    <input type="number" name="employee_id" placeholder="Employee ID" required>
    <input type="date" name="pay_period_start" required>
    <input type="date" name="pay_period_end" required>
    <input type="number" step="0.01" name="basic_salary" placeholder="Basic Salary" required>
    <input type="number" step="0.01" name="overtime_hours" placeholder="OT Hours">
    <input type="number" step="0.01" name="overtime_rate" placeholder="OT Rate">
    <input type="number" step="0.01" name="overtime_amount" placeholder="OT Amount">
    <input type="number" step="0.01" name="bonus" placeholder="Bonus">
    <input type="number" step="0.01" name="deductions" placeholder="Deductions">
    <input type="number" step="0.01" name="tax_deduction" placeholder="Tax Deduction">
    <input type="number" step="0.01" name="net_salary" placeholder="Net Salary" required>
    <select name="status">
        <option value="Draft">Draft</option>
        <option value="Processed">Processed</option>
        <option value="Paid">Paid</option>
    </select>
    <input type="number" name="processed_by" placeholder="Processed By">
    <input type="submit" value="Add Payroll">
</form>

<script>
    fetch('fetch_payroll.php')
        .then(res => res.text())
        .then(data => document.getElementById('payroll-table').innerHTML = data);
</script>
</body>
</html>
